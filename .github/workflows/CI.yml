name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on:
      - self-hosted
      - cuda
    name: CUDA (Python ${{ matrix.python-version }}, PyTorch ${{ matrix.pytorch-version }})
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.14"]
        pytorch-version: ["2.10", "2.13"]

    steps:
      - uses: actions/checkout@v7

      - uses: conda-incubator/setup-miniconda@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: "Install MLIPOps"
        shell: bash -l {0}
        run: |
          pip install -r devtools/ci/requirements.txt 'torch==${{ matrix.pytorch-version }}.*'
          pip install .

      - name: "Test MLIPOps"
        shell: bash -l {0}
        run: |
          pytest -n 4 -v tests/*.py
